#version: '3.8'

services:
  whale-web:
    build: .
    container_name: whale-signal-web
    ports:
      - "8000:8000"
    environment:
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - INFURA_API_KEY=${INFURA_API_KEY}
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - QUICKNODE_SOLANA_URL=${QUICKNODE_SOLANA_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - SOLSCAN_API_KEY=${SOLSCAN_API_KEY}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - whale-network

  nginx:
    image: nginx:alpine
    container_name: whale-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - whale-web
    restart: unless-stopped
    networks:
      - whale-network

  # Опционально: Redis для кеширования
  redis:
    image: redis:alpine
    container_name: whale-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - whale-network

  # Опционально: Monitoring с Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: whale-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - whale-network

volumes:
  redis_data:
  grafana_data:

networks:
  whale-network:
    driver: bridge